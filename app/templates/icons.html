{# Иконки в одном месте, чтобы шаблоны оставались короткими. #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'guitar' -%}
<path d="M20 4l-6.5 6.5"/><path d="M18 2l4 4"/><path d="M11.5 9.5c-1.5-1-3.6-.9-4.9.4-.8.8-1 1.8-.9 2.7-1.4.1-2.6.7-3.3 1.6-1.6 2 .2 5.3 2.3 6.6 2.1 1.3 5 .9 6.2-1 .5-.8.7-1.8.6-2.9.9.1 1.9-.1 2.7-.9 1.3-1.3 1.4-3.4.4-4.9"/><circle cx="9" cy="15" r="1.5"/>
{%- elif name == 'sun' -%}
<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == 'moon' -%}
<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
{%- elif name == 'back' -%}
<path d="M19 12H5M12 19l-7-7 7-7"/>
{%- elif name == 'shuffle' -%}
<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
{%- elif name == 'chevron' -%}
<path d="M9 18l6-6-6-6"/>
{%- elif name == 'heart' -%}
<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.6 1-1.1a5.5 5.5 0 0 0 0-7.7z"/>
{%- elif name == 'note' -%}
<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
{%- elif name == 'warning' -%}
<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro cover(url, cls='', placeholder='note') -%}
{%- if url -%}
<img class="cover {{ cls }}" src="{{ url }}" alt="" loading="lazy" onerror="this.removeAttribute('src')">
{%- else -%}
<div class="cover cover-placeholder {{ cls }}">{{ icon(placeholder) }}</div>
{%- endif -%}
{%- endmacro %}
