{% extends "base.html" %}
{% block title %}Вход · Аккорды{% endblock %}
{% block content %}
<form class="panel login" method="post" action="/login">
  <h1>Вход</h1>
  {% if failed %}<p class="error-text">Неверный пароль</p>{% endif %}
  <input class="field" type="password" name="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
  <button class="button button-accent" type="submit">Войти</button>
</form>
{% endblock %}
