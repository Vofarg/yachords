# Настройки для Render.com: сайт собирается и запускается из GitHub автоматически.
services:
  - type: web
    name: yachords
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: YANDEX_MUSIC_TOKEN
        sync: false
      - key: YANDEX_MUSIC_UID
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: INFO
